<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="9in" viewBox="0 0 432 648"><title>Lowreach: Places and Connections</title>
<desc>A one-page appendix schematic of selected relationships in Lowreach. A Stackhold stands above Intake Nine, which has a water connection to Silt’s drainage culvert. An independent old tram feeder powers the old tram switchhouse beneath the Stackhold’s southern span. A quay utility sells electricity to Tern cold store under an independent contract. Tern provides limited night electricity and cooling to the old tram depot and repair kitchen in Silt, and sends food to Kestrel Street, which contains a residential care home. Vesper controls Tomorrow, the city-service control system, and the virtual custody interface represented as a hall. Undertow directs its Blindroom hacking division, which also works in a room above the parts counter. Solid grey lines show physical relationships, blue lines show supply, and dashed green arrows show organizational control. Positions are diagrammatic, not geographic; only selected links are shown, and they refer to arrangements at different points in the story.</desc>
