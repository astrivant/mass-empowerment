repos:
  - repo: local
    hooks:
      - id: codeowners
        name: CODEOWNERS syntax and paths
        entry: env REPOSITORY_PATH=. CHECKS=files,duppatterns,syntax EXPERIMENTAL_CHECKS= CHECK_FAILURE_LEVEL=warning codeowners-validator
        language: golang
        language_version: 1.27.2
        additional_dependencies:
          - github.com/mszostok/codeowners-validator@7f3f5e28c6d7b8dfae5731e54ce2272ca384592f # v0.7.4
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff lint
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pydocstyle
        name: Google docstring style
        entry: poetry run pydocstyle
        language: system
        types: [python]
      - id: pydoclint
        name: Typed docstring contracts
        entry: poetry run pydoclint
        language: system
        types: [python]
      - id: shellcheck
        name: ShellCheck
        entry: poetry run shellcheck -x
        language: system
        types: [shell]
      - id: shfmt
        name: Shell formatting
        entry: poetry run shfmt -d -i 4
        language: system
        types: [shell]
      - id: documentation-contents
        name: Documentation contents (edition README exception)
        entry: poetry run python scripts/documentation/contents.py
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-syntax
        name: Markdown math and Mermaid syntax
        entry: npm --prefix scripts/documentation run check
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-javascript
        name: Documentation tooling JavaScript
        entry: npm --prefix scripts/documentation run lint
        language: system
        pass_filenames: false
        files: '^scripts/documentation/.*\.(mjs|json)$'
      - id: actionlint
        name: GitHub Actions and embedded shell
        entry: bash scripts/ci/actionlint.sh
        language: golang
        language_version: 1.27.2
        additional_dependencies:
          - github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
        pass_filenames: false
        always_run: true
      - id: edition
        name: Edition integrity
        entry: poetry run python scripts/edition.py validate
        language: system
        pass_filenames: false
        always_run: true
