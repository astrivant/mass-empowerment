repository:
  description: The Hours We Keep, an illustrated novella with a public-source evidence appendix.
  has_issues: true
  has_wiki: false
  delete_branch_on_merge: true
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        checks:
          - context: PR quality gate
            app_id: 15368
      # An agent requires explicit maintainer approval and passing CI for a particular override.
      enforce_admins: false
      restrictions: null
      required_conversation_resolution: true
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
