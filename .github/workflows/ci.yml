name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: poetry run pre-commit run --all-files
      - run: poetry run python scripts/documentation/contents.py --check
  tests:
    name: Test tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: poetry run pytest --cov --cov-report=xml --cov-report=term-missing
      - run: npm --prefix scripts/documentation test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooling-coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: poetry run pip-audit
      - run: npm --prefix scripts/documentation audit
  build:
    name: Package edition
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Package this immutable checkout
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'preview' }}
        run: poetry run python scripts/edition.py build --tag "$RELEASE_TAG" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edition-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  gate:
    name: PR quality gate
    if: always()
    needs: [checks, tests, security, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/quality-gate.sh
  release:
    name: Publish signed edition
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.gate.result == 'success' }}
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edition-${{ github.sha }}
          path: dist
      - run: bash scripts/release/publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          EXPECTED_RELEASE_KEY_FINGERPRINT: ${{ vars.EXPECTED_RELEASE_KEY_FINGERPRINT }}
  acceptance:
    name: Verify published release
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [gate, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Require successful publication for this tag
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: test "$GATE_RESULT" = success && test "$RELEASE_RESULT" = success
      - run: bash scripts/release/verify.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_KEY_FINGERPRINT: ${{ vars.EXPECTED_RELEASE_KEY_FINGERPRINT }}
