[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
ruff = "0.17.0"
mypy = "2.4.0"
pydocstyle = "6.3.0"
pydoclint = "0.11.1"
pre-commit = "4.7.0"
pytest = "9.1.1"
pytest-xdist = "3.8.0"
pytest-cov = "7.1.0"
pypdf = "6.20.1"
pip-audit = "2.10.1"
shellcheck-py = "0.11.0.1"
shfmt-py = "4.2.0"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "TC"]
ignore = ["D200", "D202", "D212"]
extend-select = ["D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
files = ["scripts"]

[tool.pydocstyle]
convention = "google"
add-ignore = ["D200", "D202", "D212"]
add-select = ["D213"]
match = ".*\\.py"

[tool.pydoclint]
exclude = "\\.git|\\.tox|\\.venv|\\.cache"
allow-init-docstring = true
style = "google"
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-arg-order = true
require-return-section-when-returning-nothing = true
skip-checking-raises = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "-ra -n 2 --import-mode=importlib"

[tool.coverage.run]
source = ["scripts.edition"]
branch = true
